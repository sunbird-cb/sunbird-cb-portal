<div class="flex flex-col item-center mt-11 peoples-card" [ngClass]="{'mx-1': addMargin}">
    <div class="flex flex-col card-container">
        <div class="photo-container flex items-center justify-center cursor-pointer" (click)="goToUserProfile(user)">
            <sb-uic-avatar-photo i18n-aria-label role="link" tabindex="0" [name]="userAvatarName" [photoUrl]="user?.profileImageUrl"
                size="m-side-recommended">
            </sb-uic-avatar-photo>
        </div>
        <div class="name-container text-center flex flex-col">
            <div class="" i18n-aria-label role="link" tabindex="0" (click)="goToUserProfile(user)">
                <div class="name">
                  <sb-uic-connection-name [hoverUser]="user" [showBadge]="showBadge" [showMentor]="showMentor"></sb-uic-connection-name>
                </div>
                <div class="designation ws-mat-black60-text mat-body-2" *ngIf="user?.designation">
                    {{user?.designation}}
                </div>
                <div class="designation ws-mat-black60-text mat-body-2" *ngIf="user?.employmentDetails">
                    {{user?.employmentDetails?.departmentName}}
                </div>
                <div class="designation ws-mat-black60-text mat-body-2">
                    {{user?.personalDetails?.batch}}
                </div>
            </div>
        </div>
        <div class="action-container flex items-center justify-center">
            <button mat-button color="accent" type="button" class="connect_btn flex justify-center item-center"
                (click)="connetToUser()" *ngIf="!user?.requestSent" [ngClass]="{'disabled-btn': user?.requestSent === false}">
                <span class="ws-mat-default-text" ><img class="connect-icon mr-1" src="assets/icons/Connect_icon.svg" alt="add"/>{{'connectionPeopleCard.connect' | translate}}</span>
            </button>
            <button mat-button color="accent" type="button" class="connection-sent flex justify-center item-center"
                disabled *ngIf="user?.requestSent">
                <span class="" >{{'connectionPeopleCard.connectionSent' | translate}}</span>
            </button>
        </div>
    </div>
</div>

<input type="hidden" i18-value i18-aria-value aria-value="Connection sent" value="{{'connectionPeopleCard.connectionSentSuccessfully' | translate}}" #toastSuccess />
<input type="hidden" i18-value i18-aria-value aria-value="Connection failed"
    value="Something went wrong, please try again later!" #toastError />
