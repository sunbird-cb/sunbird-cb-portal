<div class="w-full flex flex-col md:p-4">
  <div class="mentor-note-card flex justify-between items-center p-6 mb-4 mr-4 gap-2">
    <div class="mentor-note-text">
      {{'NetworkLandingPage.connectWithMentorsWhoWillGuideYourLearningJourney' | translate}}
    </div>
    <button class="discover-mentor-btn" (click)="descoverMentors()">
      {{'NetworkLandingPage.discoverMentor' | translate}}
    </button>
  </div>

  <div class="header flex items-center gap-2">
    {{'NetworkLandingPage.mentors' | translate}}
  </div>

  <div class="section flex gap-3 md:gap-4 w-full md:justify-start justify-center flex-wrap">
    <ng-container *ngIf="!mentorsListLoading; else showMentorsSkeleton">
      <ng-container *ngIf="mentorsList?.length > 0; else noMentorsFound">
        <ng-container *ngFor="let otherUserProfile of mentorsList">
          <ws-app-connection-people-card [user]="otherUserProfile"></ws-app-connection-people-card>
        </ng-container>
      </ng-container>
      <ng-template #noMentorsFound>
        <div class="w-full flex flex-col gap-4 justify-center items-center no-records-found">
              <img class="emptyPageIcon" src="./assets/icons/no-data.svg" alt="empty">
              <div class="no-data-text">
                {{'NetworkLandingPage.noMentorsFound' | translate}}
              </div>
            </div>
      </ng-template>
    </ng-container>
    <ng-template #showMentorsSkeleton>
      <ng-container *ngFor="let i of [1,2,3,4,5,6]">
        <ws-widget-skeleton-loader
          [width]="'170px'"
          [height]="'174px'"
          [bindingClass]="'flex rounded margin-bottom-xs'">
        </ws-widget-skeleton-loader>
      </ng-container>
    </ng-template>
  </div>

  <ng-container *ngIf="totalItemsCount > defaultPaginationSize">
    <div>
      <ws-widget-pagination [defaultPaginationSize]="paginationSize"
        [defaultPaginationSizeOptions]="paginationSizeOptions"
        [totalItemsCount]="totalItemsCount"
        [pageMessage]="'View designations per page'"
        [numberOfPaginationVisable]="2"
        (pageChange)="onPageChange($event)"></ws-widget-pagination>
    </div>
  </ng-container>
</div>
