<!-- #region (Mobile Header Bar) -->
<div class="md:hidden">
  <div class="flex mobile-header">
    <span class="back-arrow">
      <mat-icon class="navigateBack-icon" (click)="navigateHome()">chevron_left</mat-icon>
    </span>
    <span class="header-title">Network Hub</span>
  </div>
</div>
<!-- #endregion (Mobile Header Bar) -->
<div class="flex md:gap-6 justify-center mt-6 pb-4">
  <!-- #region (left nav content) -->
  <div class="hidden flex flex-col gap-4 left-nav-content">
    <div class="profile hidden md:block">
      <ws-app-profile-card [userDetails]="userDetails" [profileDetailsLoading]="profileDetailsLoading"></ws-app-profile-card>
    </div>
    <div class="navigation">
      <ws-app-network-navigation [navigationItems]="navigationItems"></ws-app-network-navigation>
    </div>
  </div>
  <!-- #endregion (left nav content) -->

  <!-- #region (center content) -->
   <div class="flex center-content">
    <router-outlet></router-outlet>
   </div>
   <!-- #endregion (center content) -->

  <!-- #region (right nav content) -->
  <div class="hidden md:flex flex-col gap-4 right-nav-content">
    <div class="suggestions-header">{{ 'NetworkLandingPage.recommendedCommunities' | translate }}</div>
    <ws-app-community-suggestions [isLoading]="communitiesLoading"
          [communitySuggestionsList]="communitySuggestionsList"></ws-app-community-suggestions>
  </div>
  <!-- #endregion (right nav content) -->
</div>
