<div class="common-card-css" *ngIf="customAttrListIds && customAttrListIds.length" id="orgDetails">
  <div class="flex flex-col gap-5">
    <div class="flex flex-row gap-4 items-center justify-between  mb-4">
      <div class="flex flex-row gap-2 title-div items-center">
        <div class="title">{{ 'profileInfo.customFields' | translate }}</div>
      </div>
      <ng-container *ngIf="customFieldValues && customFieldValues.length">
        <div class="flex flex-row info-value">
          <div class="flex flex-row gap-2 items-center" *ngIf="!editCustomDetails" (click)="handleEditCustomDetails()">
            <mat-icon class="edit-button">edit</mat-icon>
          </div>
        </div>
      </ng-container>
      <ng-container *ngIf="customFieldValues && customFieldValues.length === 0">
        <div class="flex flex-row info-value">
          <div class="flex flex-row gap-2 items-center " *ngIf="!editCustomDetails" (click)="handleEditCustomDetails()">
            <mat-icon class="add-button">add</mat-icon>
          </div>
        </div>
      </ng-container>
    </div>
    <div class="flex flex-col gap-6 sm:gap-8 custom-attr-info" *ngIf="customFieldValues && customFieldValues.length">
      <div class="grid-container mt-2">
        <!-- Text fields - Each in its own grid cell -->
        <ng-container *ngFor="let item of customAttrList">
          <div *ngIf="item?.type === 'text'" class="grid-item">
            <div class="flex flex-col gap-2 pr-3 info-div">
              <span class="label">{{item?.name}}</span>
              <span class="value">{{getValue(item?.attributeName) || '-'}}</span>
            </div>
          </div>
        </ng-container>

        <!-- MasterList fields - Each level gets its own grid cell -->
        <ng-container *ngFor="let item of customAttrList">
          <ng-container *ngIf="item?.type === 'masterList' && item?.originalCustomFieldData">
            <ng-container *ngFor="let filed of item?.originalCustomFieldData">
              <div class="grid-item">
                <div class="flex flex-col gap-2 pr-3 info-div">
                  <span class="label">
                    <!-- Show parent field name only for the first item -->
                    {{filed?.name | titlecase}}
                  </span>
                  <span class="value">{{getListItemName(item, filed) || '-'}}</span>
                </div>
              </div>
            </ng-container>
          </ng-container>
        </ng-container>
      </div>
    </div>
  </div>
  <div class="flex flex-col gap-6 sm:gap-8 custom-attr-info"
    *ngIf="customFieldValues && customFieldValues.length === 0">
    <div class="flex justify-center items-center w-full">
      <img class="empty-gif" src="./assets/icons/empty.gif" alt="empty gif">
    </div>
  </div>
</div>
