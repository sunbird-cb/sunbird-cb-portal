<div class="skeleton-wrapper">
    <div class="flex flex-col card-container all-result-peoples py-3">
        <div class="photo-container flex items-center justify-center">
            <ws-widget-skeleton-loader [height]="'64px'" [width]="'64px'" [bindingClass]="'rounded-full'"></ws-widget-skeleton-loader>
        </div>
        <div class="name-container text-center flex flex-col width-expand mt-2">
            <ws-widget-skeleton-loader [height]="'20px'" [width]="'70%'" [bindingClass]="'m-auto'"></ws-widget-skeleton-loader>
            <ws-widget-skeleton-loader [height]="'15px'" [width]="'50%'" [bindingClass]="'m-auto mt-1'"></ws-widget-skeleton-loader>
        </div>
        <div class="action-container flex items-center justify-center mt-3">
            <ws-widget-skeleton-loader [height]="'36px'" [width]="'120px'" [bindingClass]="'rounded-full'"></ws-widget-skeleton-loader>
        </div>
    </div>
</div>
