<div class="flex flex-col item-center mt-10">
    <div class="flex flex-col card-container cursor-pointer" [ngClass]="{'all-result-peoples': category && category === 'peoples'}">
        <div class="photo-container flex items-center justify-center cursor-pointer" (click)="goToUserProfile(user)">

            <ws-widget-avatar-photo i18n-aria-label role="link" tabindex="0" [name]="getUseravatarName()"
                [photoUrl]="user?.photo || user?.profileDetails?.profileImageUrl" [size]="'round-m'">
            </ws-widget-avatar-photo>
        </div>
        <div class="name-container text-center flex flex-col width-expand">
            <div class="" i18n-aria-label role="link" tabindex="0" (click)="goToUserProfile(user)">
                <div class="connection-name">
                    <!-- <ws-app-connection-name [hoverUser]="user"></ws-app-connection-name> -->
                    <span class="mat-body-1 name text-center">{{user?.firstName | titlecase }}</span>
                </div>
                <div class="designation ws-mat-black60-text mat-body-2 m-auto">
                    {{userDesignation}}
                </div>
            </div>
        </div>
        <div class="action-container flex items-center justify-center">
            <button mat-flat-button color="accent" type="button" class="mat-btn-outline cursor-pointer"
                (click)="connetToUser()" *ngIf="!user?.requestSent">
                <img class="connect-icon" src="assets/icons/Connect_icon.svg" width="24" />
                <span class="ws-mat-default-text">{{'connectionPeopleCard.connect' | translate}}</span>
            </button>

            <button mat-flat-button color="accent" type="button" class="mat-btn-outline cursor-pointer" disabled
                *ngIf="user?.requestSent">
                <span class="">{{'connectionPeopleCard.connectionSent' | translate}}</span>
            </button>
        </div>
    </div>
</div>
