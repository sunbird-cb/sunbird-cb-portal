<div class="document-viewer-container">
  <!-- Loading spinner -->
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <p class="loading-text">Loading document...</p>
  </div>

  <!-- Error message -->
  <div *ngIf="error" class="error-container">
    <mat-icon class="error-icon">error_outline</mat-icon>
    <p class="error-message">{{ errorMessage }}</p>
    <p class="error-url">URL: {{ documentUrl }}</p>
  </div>


  <div class="flex">
    <div class="left-div" style="width: 100%; height: calc(100vh - 107px);">
      <div class="left-title font-bold p-5 mb-5 flex flex-row justify-between">
        <div>Post Assignment Preview</div>
        <div class="flex gap-4">
          <button mat-button class="discard-btn cursor-pointer" (click)="handleClose()">
            {{ 'userAssignments.discard' | translate }}
          </button>
          <button mat-button class="submit-btn cursor-pointer" (click)="handleSubmitAssignment()">
            {{ 'userAssignments.submit' | translate }}
          </button>
        </div>
      </div>
      <div class="loaders" *ngIf="loading">
        <mat-spinner diameter="40" class="blue-spinner m-auto"></mat-spinner>
      </div>
      <div *ngIf="!loading && !error">
        <div *ngIf="!error" class="iframe-container  pb-4" [ngStyle]="{ 'height': height, 'width': '100%' }">
          <iframe *ngIf="safeSrc" [src]="safeSrc" [ngStyle]="{ 'width': '100%', 'height': '100%' }" frameborder="1"
            (load)="onIframeLoad()" (error)="onIframeError()">
          </iframe>
        </div>
      </div>
    </div>
  </div>
